<!doctype html>
<html><head><meta charset="utf-8"><title>Bike Dash Phone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Phone dash: laid out on a 90 x 195 grid of --u units (19.5:9) and scaled to fit the window.
   Portrait stacks everything; landscape puts speed left and the pack column right. */
:root{--bg:#05070a;--panel:#0d1117;--line:#1f2933;--fg:#e8edf2;--dim:#7d8b99;--acc:#3ddc97;--warn:#ffb020;--bad:#ff3b3b;
 --u:min(100vw/90,100dvh/195)}
@media (orientation:landscape){:root{--u:min(100vw/195,100dvh/90)}}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#dash{width:calc(var(--u)*90);height:calc(var(--u)*195);background:var(--bg);position:relative;overflow:hidden;
 display:grid;grid-template-rows:auto 1fr auto auto auto;padding:calc(var(--u)*4);box-sizing:border-box;gap:calc(var(--u)*3)}
@media (orientation:landscape){#dash{width:calc(var(--u)*195);height:calc(var(--u)*90);grid-template:1fr auto auto/1.3fr 1fr}
 .left{grid-row:1/2} .right{grid-row:1/2;grid-column:2} .media{grid-column:1/3} .ctl{grid-column:1/3}}
.left{display:flex;flex-direction:column;min-height:0}
.top{display:flex;gap:calc(var(--u)*4);font-size:calc(var(--u)*4.2);color:var(--dim);align-items:flex-start}
.rec{color:var(--bad)} .gps{color:var(--acc)}
.net{margin-left:auto;font-size:calc(var(--u)*2.9);line-height:1.25;color:var(--dim);text-align:right;white-space:nowrap}.net .off{color:var(--bad);font-size:calc(var(--u)*4.2)}
.speed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.speed b{font-size:calc(var(--u)*46);line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}
.speed span{font-size:calc(var(--u)*6);color:var(--dim);letter-spacing:calc(var(--u)*1.2)}
.bottom{display:flex;justify-content:space-between;font-size:calc(var(--u)*4.6);color:var(--dim)}
.right{display:flex;flex-direction:column;gap:calc(var(--u)*2.6);font-size:calc(var(--u)*5);
 border-top:calc(var(--u)*.4) solid var(--line);padding-top:calc(var(--u)*3)}
@media (orientation:landscape){.right{border-top:0;padding-top:0;border-left:calc(var(--u)*.4) solid var(--line);padding-left:calc(var(--u)*4)}}
.row{display:flex;justify-content:space-between;align-items:baseline}
.soc{font-size:calc(var(--u)*10);font-weight:700}
.bar{height:calc(var(--u)*3.4);background:var(--line);border-radius:calc(var(--u)*1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.dim{color:var(--dim)} hr{border:0;border-top:calc(var(--u)*.4) solid var(--line);width:100%;margin:0}
.rst{background:var(--line);color:var(--fg);border:0;border-radius:calc(var(--u)*2);font-size:calc(var(--u)*3.6);padding:calc(var(--u)*2) calc(var(--u)*3);cursor:pointer;transition:background .35s,color .35s;flex:1}
.rst.hit{background:#fff;color:#000;transition:none}
.media{border-top:calc(var(--u)*.4) solid var(--line);padding-top:calc(var(--u)*3);display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*1.5);align-items:center}
.media .t{grid-column:1/-1;font-size:calc(var(--u)*5);min-width:0;overflow:hidden;white-space:nowrap}
.media .t span{display:inline-block}.media .t.rest span{max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
@media (orientation:landscape){.media{grid-template-columns:3fr repeat(5,1fr)}.media .t{grid-column:auto}}
.media button{background:none;border:0;color:var(--fg);font-size:calc(var(--u)*7.5);cursor:pointer;border-radius:calc(var(--u)*2.5);
 padding:calc(var(--u)*1.5) 0;transition:background .35s,color .35s;-webkit-tap-highlight-color:transparent}
.media button.hit{background:#fff;color:#000;transition:none}
#alert{position:absolute;inset:0;background:var(--bad);display:none;flex-direction:column;align-items:center;justify-content:center;font-weight:900;text-align:center}
#alert b{font-size:calc(var(--u)*15)} #alert span{font-size:calc(var(--u)*5)}
.ctl{display:flex;gap:calc(var(--u)*1.6);flex-wrap:wrap;justify-content:center;font-size:calc(var(--u)*2.8);color:#ccc}
</style></head><body>
<div id="dash">
  <div class="left">
    <div class="top"><span class="gps" id="gpsTag">GPS:<span id="sats">0</span></span><span>TRIP <span id="trip">0.0</span>mi</span><span class="rec" id="rec">REC</span><span class="net" id="net"></span></div>
    <div class="speed"><b id="spd">0</b><span>MPH</span></div>
    <div class="bottom"><span id="clock"></span><span id="bmsTag">BMS</span></div>
  </div>
  <div class="right">
    <div class="row"><span class="dim">SOC</span><span class="soc" id="soc">78%</span></div>
    <div class="bar"><i id="socbar"></i></div>
    <div class="row"><span>PACK <span id="v">78.4</span>V</span><span id="a">12A</span></div>
    <div class="row"><span>TEMP <span id="temp">32</span>°C</span><span class="dim">cut@60</span></div>
    <div class="row"><span>RANGE</span><span id="range">M44 / H27 mi</span></div>
    <hr><div class="dim"><span id="ah">44.0</span> Ah remaining</div>
    <div style="display:flex;gap:12px"><button id="rst" class="rst">Restart board</button><button id="rbt" class="rst">Restart Bluetooth</button></div>
  </div>
  <div class="media"><span class="t rest" id="song"><span id="songIn">♪ no phone connected</span></span><button data-c="6">🔉</button><button data-c="4">⏮</button><button id="pp" data-c="2">⏯</button><button data-c="3">⏭</button><button data-c="5">🔊</button></div>
  <div class="ctl"><span id="link" class="pill">ESP: connecting…</span><span id="bms" class="pill">BMS: xx</span><span id="gpsl" class="pill">GPS: xx</span><span id="phl" class="pill">Phone: xx</span><button id="demo" class="pill" style="border:0;color:#fff;cursor:pointer">Simulate data</button><span>alert at 50°C</span></div>
  <div id="alert"><b>TEMP <span id="atemp">52</span>°C</b><span>PACK OVERHEAT — EASE OFF</span></div>
</div>

<style>.pill{padding:.3em .7em;border-radius:.4em;background:#555;font-size:1em}.ok{background:#1f7a4d}.bad{background:#8a2a2a}</style>
<script>
// Live data only, from the P4 (ESPHome web_server /events). No fake values: missing data shows xx.
const MAX_RANGE_MI=60; // full-charge range, placeholder until real rides calibrate it
const ESP='http://'+(location.hostname||'192.168.7.18'),ALERT=50;const live={};let lastMsg=0,trip=0,prev=Date.now();
const $=id=>document.getElementById(id);
function connect(){const es=new EventSource(ESP+'/events');
 es.addEventListener('state',e=>{const d=JSON.parse(e.data);live[d.id]=d.value;lastMsg=Date.now()});
 es.addEventListener('ping',()=>lastMsg=Date.now());
 es.onerror=()=>{es.close();setTimeout(connect,3000)}}
connect();
// Demo mode: fake ride data for showing people. Clearly badged, never mixed with live values.
let demo=false,dt=0,D={};
const demoVals=()=>{dt+=.25;const sp=Math.max(0,Math.round(35+28*Math.sin(dt/6)+6*Math.sin(dt*1.3)));
 const soc=Math.max(5,78-dt/40);return {'binary_sensor/BMS Connected':true,'binary_sensor/Phone Connected':true,
 'binary_sensor/Phone Playing':true,'sensor/Speed':sp,'sensor/GPS Satellites':11,'sensor/soc':soc,
 'sensor/voltage':66+soc*0.22,'sensor/current':sp*0.6,'sensor/ah_remaining':soc*0.6,'sensor/temp1':32+sp/20,
 'text_sensor/Track Title':'Kickstart My Heart','text_sensor/Track Artist':'Mötley Crüe'}};
const num=k=>{const v=(demo?D:live)[k];return (v===null||v===undefined||v===''||isNaN(v))?null:+v};
const f=(v,d=0)=>v===null?'xx':v.toFixed(d);
function pill(id,txt,cls){$(id).textContent=txt;$(id).className='pill '+cls}
document.querySelectorAll('.media button').forEach(b=>b.addEventListener('pointerdown',()=>{b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),150)}));
document.querySelectorAll('.media button').forEach(b=>b.addEventListener('click',()=>fetch('/cmd?c='+b.dataset.c,{method:'POST'}).catch(()=>{})));
function tick(){
  if(demo)D=demoVals();
  const L=demo?D:live;
  const now=Date.now(),on=demo||now-lastMsg<15000,bms=on&&L['binary_sensor/BMS Connected']===true;
  const spd=on?num('sensor/Speed'):null,sat=on?num('sensor/GPS Satellites'):null;
  pill('link',demo?'DEMO DATA':on?'ESP: connected':'ESP: offline',on?'ok':'bad');$('link').style.background=demo?'#b8860b':'';
  pill('bms',bms?'BMS: connected':'BMS: searching…',bms?'ok':'bad');
  pill('gpsl',spd!==null?'GPS: fix':'GPS: no data',spd!==null?'ok':'bad');
  const g=k=>bms?num(k):null;
  const soc=g('sensor/soc'),V=g('sensor/voltage'),A=g('sensor/current'),AH=g('sensor/ah_remaining');
  const ts=['sensor/temp1','sensor/temp2','sensor/temp3','sensor/temp4'].map(g).filter(v=>v!==null);
  const temp=ts.length?Math.max(...ts):null;
  if(spd!==null)trip+=spd*(now-prev)/3600000;prev=now;
  $('spd').textContent=spd===null?'0':spd.toFixed(0);$('sats').textContent=sat===null?'0':sat.toFixed(0);$('bmsTag').style.color=bms?'var(--acc)':'var(--bad)';$('gpsTag').style.color=spd===null?'var(--bad)':'var(--acc)';$('trip').textContent=spd===null?'xx':trip.toFixed(1);
  $('soc').textContent=soc===null?'xx%':Math.round(soc)+'%';
  $('socbar').style.width=(soc??0)+'%';
  $('socbar').style.background=soc===null?'var(--line)':soc<20?'var(--bad)':soc<35?'var(--warn)':'var(--acc)';
  $('v').textContent=f(V,1);$('a').textContent=f(A)+'A';$('temp').textContent=f(temp);$('atemp').textContent=f(temp);
  $('ah').textContent=f(AH,1);
  $('range').textContent=soc===null?'xx mi':Math.round(MAX_RANGE_MI*soc/100)+' mi'; // simple SOC scale until Stage 6 model
  $('alert').style.display=(temp!==null&&temp>=ALERT)?'flex':'none';
  const rec=demo||(on&&live['binary_sensor/Log OK']===true); // green while the device log is running
  $('rec').style.color=rec?'var(--acc)':'var(--bad)';
  const ph=on&&L['binary_sensor/Phone Connected']===true,ti=on?L['text_sensor/Track Title']:'',ar=on?L['text_sensor/Track Artist']:'';
  pill('phl',ph?'Phone: connected':'Phone: not paired',ph?'ok':'bad');
  setSong(ph?('♪ '+(ti||'nothing playing')+(ar?' — '+ar:'')):'♪ no phone connected');
  $('pp').textContent=(ph&&L['binary_sensor/Phone Playing']===true)?'⏸':'▶';
  const ip=on&&!demo?(live['text_sensor/IP Address']||''):'';
  const ports='dash :8080 · phone :8082 · log :8081';$('net').innerHTML=demo?`192.168.7.18<br>${ports}`:ip&&ip!=='0.0.0.0'?`${ip}<br>${ports}`:'<span class="off">wifi</span>';
  $('clock').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).toLowerCase().replace(' ','');
}
$('demo').onclick=()=>{demo=!demo;trip=0;dt=0;$('demo').textContent=demo?'Stop simulation':'Simulate data'};
// Song line: one line with ellipsis. If it's too long, glide left to reveal up to one extra
// line-width (about 2x the visible length), pause, glide back, repeat.
let songTxt='',songTimer=null;
function setSong(t){if(t===songTxt)return;songTxt=t;const box=$('song'),el=$('songIn');
 clearTimeout(songTimer);el.textContent=t;el.style.transition='none';el.style.transform='none';box.classList.add('rest');
 const cycle=()=>{box.classList.remove('rest');const over=el.scrollWidth-box.clientWidth;
  if(over<=0){box.classList.add('rest');return}
  box.classList.add('rest');
  // reveal up to one more visible width (about 2x the default length), then return
  const shift=Math.min(over,box.clientWidth),dur=shift/45;
  songTimer=setTimeout(()=>{box.classList.remove('rest');el.style.transition=`transform ${dur}s linear`;el.style.transform=`translateX(${-shift}px)`;
   songTimer=setTimeout(()=>{el.style.transform='translateX(0)';
    songTimer=setTimeout(()=>{box.classList.add('rest');songTimer=setTimeout(cycle,0)},dur*1000);},dur*1000+2000);},3000);};
 requestAnimationFrame(cycle);}
$('rst').onclick=async()=>{const b=$('rst');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),150);
 if(!confirmArm){confirmArm=true;b.textContent='Tap again to restart';setTimeout(()=>{confirmArm=false;b.textContent='Restart board'},3000);return}
 confirmArm=false;b.textContent='Restarting…';try{await fetch('/restart',{method:'POST'})}catch(e){}
 setTimeout(()=>location.reload(),15000)};
let confirmArm=false;
$('rbt').onclick=async()=>{const b=$('rbt');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),150);
 b.textContent='Restarting…';try{await fetch('/restart_bt',{method:'POST'})}catch(e){}
 setTimeout(()=>b.textContent='Restart Bluetooth',4000)};
setInterval(tick,250);tick();
</script></body></html>
