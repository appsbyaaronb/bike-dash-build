# bike-dash on Waveshare ESP32-P4-NANO + Riverdi RVT70HSMNWC00-B (7" 1024x600, 850 nit)
# Stage 0/1 bring-up config. Validate with `esphome config` first.
# Pins follow docs/wiring.md: panel RESET on GPIO27, LED driver PWM on GPIO26 (P4-NANO BSP defaults).

substitutions:
  name: bike-dash
  lcd_reset_pin: GPIO27
  backlight_pwm_pin: GPIO26
  gps_tx_pin: GPIO20   # P4 TX -> GPS RX. header P1 pin 13 (24/25 are the USB-Serial-JTAG pins)
  gps_rx_pin: GPIO21   # P4 RX <- GPS TX. header P1 pin 15
  touch_int_pin: GPIO22    # touch tail pin 9, header P1 pin 16 (ILI2132A, driver not written yet)
  touch_reset_pin: GPIO23  # touch tail pin 7, header P1 pin 7

esphome:
  name: ${name}

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    # sdkconfig_options:
    #   CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"

psram:
  mode: hex
  speed: 200MHz

logger:
  hardware_uart: UART0
  level: DEBUG

# Onboard ESP32-C6 (Wi-Fi 6 / BLE) over SDIO. Values from the ESPHome device page for the P4-NANO.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz
  scan: true   # touch ILI2132A should show at 0x41

# GPS: u-blox M8/M10 on a UART. Module must be set to 10 Hz / 115200 (docs/wiring.md Step 4b).
uart:
  - id: gps_uart
    tx_pin: ${gps_tx_pin}
    rx_pin: ${gps_rx_pin}
    baud_rate: 115200
    rx_buffer_size: 2048

gps:
  uart_id: gps_uart
  latitude:
    name: GPS Latitude
  longitude:
    name: GPS Longitude
  altitude:
    name: GPS Altitude
  satellites:
    name: GPS Satellites
  course:
    name: GPS Course
  speed:
    name: GPS Speed
    id: gps_speed_kmh
    # ESPHome reports km/h; the dash wants mph
    on_value:
      then:
        - sensor.template.publish:
            id: speed_mph
            state: !lambda 'return x * 0.621371;'

sensor:
  - platform: template
    id: speed_mph
    name: Speed
    unit_of_measurement: mph
    accuracy_decimals: 0

time:
  - platform: gps
    id: gps_time

# If the GPS module forgets its 10 Hz / 115200 setting on power loss (no flash / no battery),
# move this on_boot block under the existing `esphome:` key at the top so the dash re-sends it
# at every boot. The module boots at 9600 in that case, so the first two writes go out at 9600,
# then the UART is switched to 115200.
#   on_boot:
#     priority: -100
#     then:
#       - lambda: |-
#           id(gps_uart).set_baud_rate(9600); id(gps_uart).load_settings();
#       - uart.write: {id: gps_uart, data: [0xB5,0x62,0x06,0x08,0x06,0x00,0x64,0x00,0x01,0x00,0x01,0x00,0x7A,0x12]}
#       - uart.write: {id: gps_uart, data: [0xB5,0x62,0x06,0x00,0x14,0x00,0x01,0x00,0x00,0x00,0xD0,0x08,0x00,0x00,0x00,0xC2,0x01,0x00,0x07,0x00,0x03,0x00,0x00,0x00,0x00,0x00,0xC0,0x7E]}
#       - delay: 200ms
#       - lambda: |-
#           id(gps_uart).set_baud_rate(115200); id(gps_uart).load_settings();

# Backlight: LEDC PWM into the LED driver PWM pin. About 5 kHz so it is not visible.
output:
  - platform: ledc
    id: backlight_pwm
    pin: ${backlight_pwm_pin}
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# MIPI DSI PHY is powered from the P4 internal LDO channel 3 at 2.5 V.
esp_ldo:
  - channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 1024
      height: 600
    lanes: 2
    lane_bit_rate: 900Mbps        # try 800-1000 if scrambled
    pclk_frequency: 51.2MHz       # datasheet typ; 44.9-63 MHz allowed
    hsync_pulse_width: 70
    hsync_back_porch: 160
    hsync_front_porch: 160
    vsync_pulse_width: 10
    vsync_back_porch: 23
    vsync_front_porch: 12
    reset_pin: ${lcd_reset_pin}
    # Riverdi datasheet p.16, verbatim. 0xB2 0x50 = 2-lane.
    init_sequence:
      - [0x01]
      - delay 120ms
      - [0xB2, 0x50]
      - [0x80, 0x4B]
      - [0x81, 0xFF]
      - [0x82, 0x1A]
      - [0x83, 0x88]
      - [0x84, 0x8F]
      - [0x85, 0x35]
      - [0x86, 0xB0]
      - [0x11]
      - delay 120ms
      - [0x29]
      - delay 20ms
    auto_clear_enabled: false
    update_interval: never
    # Stage 1 test: fill the screen. Replace with the LVGL block from bike-dash at Stage 3.
    lambda: |-
      it.fill(Color(0, 80, 0));
      it.filled_rectangle(100, 100, 824, 400, Color(200, 200, 200));
